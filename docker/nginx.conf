# Generated allowlist is empty by default: direct clients cannot assert proxy headers.
geo $khirby_trusted_proxy {
    default 0;
    include /etc/nginx/trusted-proxies.conf;
}
map "$khirby_trusted_proxy:$http_x_forwarded_proto" $khirby_forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}
map $khirby_trusted_proxy $khirby_forwarded_for {
    default $remote_addr;
    1 $proxy_add_x_forwarded_for;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health — localhost only (Docker/Komodo healthchecks). Not exposed publicly.
    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://api:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $khirby_forwarded_for;
        proxy_set_header X-Forwarded-Proto $khirby_forwarded_proto;
    }

    # Agent chat SSE — longer timeout, no buffering (must precede /api/)
    location /api/agent/chat {
        proxy_pass http://api:3000/api/agent/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $khirby_forwarded_for;
        proxy_set_header X-Forwarded-Proto $khirby_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $khirby_forwarded_for;
        proxy_set_header X-Forwarded-Proto $khirby_forwarded_proto;
        # Forward cookies (session)
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
