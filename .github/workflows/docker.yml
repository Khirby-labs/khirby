name: Docker Build & Push

# Multi-arch image → Docker Hub bearlypro/khirby
# Trigger: annotated/version tags vX.Y.Z
# Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            bearlypro/khirby:latest
            bearlypro/khirby:${{ github.ref_name }}
          cache-from: type=registry,ref=bearlypro/khirby:buildcache
          cache-to: type=registry,ref=bearlypro/khirby:buildcache,mode=max
