name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, lint, tests, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync plugin deps from manifest
        run: pnpm sync:plugins

      - name: Guard plugin sync drift
        run: git diff --exit-code -- apps/api/package.json apps/api/plugin-deps.generated.json apps/web/package.json apps/web/plugin-deps.generated.json apps/api/src/modules/plugins/load-plugins.generated.ts apps/web/src/plugins/plugin-registry.generated.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Design tokens
        run: pnpm lint:design

      - name: i18n
        run: pnpm lint:i18n

      - name: Prettier
        run: pnpm format:check

      - name: Test API
        run: pnpm test:api

      - name: Test web
        run: pnpm test:web

      - name: Test forms-client
        run: pnpm test:forms-client

      - name: Test forms-ui
        run: pnpm test:forms-ui

      - name: Build API
        run: pnpm build:api

      - name: Build web
        run: pnpm build:web
